[project]
name = "tool-agent-rl"
version = "0.1.0"
description = "Policy-gradient trainers for a multi-step tool-using agent, with interpretability and a live UI."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "streamlit>=1.37",
    "plotly>=5.22",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
